[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
dhis2w-mcp = { workspace = true }
dhis2w-mcp-bridge = { workspace = true }
dhis2w-mcp-router = { workspace = true }

[dependency-groups]
dev = [
  "dhis2w-core[testing]==1.31.1",
  "coverage[toml]>=7.16.0",
  "mypy>=2.3.1",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4",
  "pytest-cov>=7",
  "respx>=0.23",
  "ruff>=0.16.3",
  "pyright>=1.1.414",
  "mkdocs>=1.6",
  "mkdocs-material>=9.7.7",
  "pytest-xdist>=3.8.0",
  "pytest-httpx2>=1.0.0",
  "httpx2>=2.12.0",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
fixable = ["ALL"]
select = ["E", "W", "F", "I", "D", "SIM", "UP", "B", "TID251"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"httpx".msg = "Import httpx2. The original httpx is allowed only in tests, for the Response and Request objects respx consumes."
"httpcore".msg = "Import httpcore2."
"urllib.request".msg = "Use httpx2."

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["D", "TID251"]
"**/__init__.py" = ["D104"]
"**/src/**/*.py" = ["D102", "D105", "D107"]
"infra/**/*.py" = ["D"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.pytest.ini_options]
asyncio_mode = "auto"
norecursedirs = ["examples", ".git", ".venv", ".hypothesis", "__pycache__", "site", "build", "dist", "scripts"]
filterwarnings = [
  # DHIS2 wire payloads carry plenty of fields not declared on our generated
  # models (which use `extra="allow"`). pydantic-core re-emits these as a
  # `PydanticSerializationUnexpectedValue` UserWarning during model_dump.
  # Filter expects `action:message_regex:category` — pin the message regex
  # to that specific class name so genuine `Pydantic serializer warnings:`
  # text from other sources surfaces instead of being silently swallowed.
  "ignore:.*PydanticSerializationUnexpectedValue.*:UserWarning",
]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "contract: live-schema contract tests against play.im.dhis2.org (network, opt-in)",
  "upstream_bug: tests paired with a DHIS2_ISSUES.md entry — bug-still-present + workaround halves",
]

[tool.coverage.run]
branch = true
relative_files = true
source = ["packages"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]
precision = 2
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
strict_equality = true
exclude = "^packages/[^/]+/tests/conftest\\.py$"

[tool.pyright]
include = ["packages", "scripts", "examples"]
exclude = ["**/.venv", "**/site", "**/build", "**/dist"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
useLibraryCodeForTypes = true
reportPrivateUsage = false
reportUnusedFunction = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
reportMissingTypeArgument = false
reportMissingTypeStubs = false
reportUnknownLambdaType = false
reportMissingImports = "warning"
reportMissingModuleSource = false
reportDeprecated = "error"
