[project]
name = "dhis2w-mcp"
version = "1.32.0"
description = "The dhis2w FastMCP server and the MCP tools of every built-in dhis2w-core plugin."
readme = "README.md"
authors = [{ name = "Morten Hansen", email = "morten@winterop.com" }]
requires-python = ">=3.13"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  # The plugin host, the profile resolver, and the services every tool calls.
  "dhis2w-core==1.32.0",
  # `Dhis2Client`, the auth schemes, the error hierarchy, and the generated models the tools return.
  "dhis2w-client==1.32.0",
  "fastmcp>=4.0",
]

[project.entry-points."dhis2w.plugins.v1"]
mcp = "dhis2w_mcp.plugin:plugin"

[project.scripts]
dhis2w-mcp = "dhis2w_mcp.server:main"

[project.urls]
Homepage = "https://github.com/winterop-com/dhis2w-mcp"
Documentation = "https://winterop-com.github.io/dhis2w-mcp/"
Repository = "https://github.com/winterop-com/dhis2w-mcp"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

