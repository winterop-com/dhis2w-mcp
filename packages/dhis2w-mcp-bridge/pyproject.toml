[project]
name = "dhis2w-mcp-bridge"
version = "1.29.0"
description = "Single-tool MCP bridge that exposes the d2w CLI for small local models."
readme = "README.md"
authors = [{ name = "Morten Hansen", email = "morten@winterop.com" }]
requires-python = ">=3.13"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "dhis2w-cli==1.28.1",
    "fastmcp>=3.4.7",
]

[project.scripts]
dhis2w-mcp-bridge = "dhis2w_mcp_bridge.server:main"

[project.urls]
Homepage = "https://github.com/winterop-com/dhis2w-mcp"
Documentation = "https://winterop-com.github.io/dhis2w-mcp/"
Repository = "https://github.com/winterop-com/dhis2w-mcp"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

